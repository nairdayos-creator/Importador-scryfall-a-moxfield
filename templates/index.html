<!DOCTYPE html>
<html>
<head>
    <title>Scryfall Exporter</title>
    <style>
        body {
            font-family: Arial;
            max-width: 500px;
            margin: 50px auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #4CAF50;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        .hint {
            color: gray;
            font-size: 12px;
        }

        .container {
            display: flex;
            flex-direction: column;
        }

        .spacer {
            height: 10px;
        }
    </style>
</head>

<body>

<h2>Exportador Scryfall → Moxfield</h2>

<p class="hint">
Ejemplo: set:khm o type:dragon
</p>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<div class="container">

    <!-- INPUT ÚNICO -->
    <form method="POST">
        <input type="text" name="query" placeholder="Introduce tu búsqueda (Scryfall syntax)" required>

        <div class="spacer"></div>

        <!-- BOTÓN CSV -->
        <button type="submit" formaction="/">
            Exportar CSV (Colección)
        </button>

        <!-- BOTÓN TXT -->
        <button type="submit" formaction="/txt">
            Exportar TXT (Decklist)
        </button>
    </form>

</div>

</body>
</html>
