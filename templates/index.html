<!DOCTYPE html>
<html>
<head>
    <title>Scryfall Exporter</title>
    <style>
        body {
            font-family: Arial;
            max-width: 500px;
            margin: 50px auto;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        button {
            background: #4CAF50;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

<h2>Exportador Scryfall → Moxfield</h2>

<p style="color: gray; font-size: 12px;">
Ejemplo: set:khm o type:dragon
</p>
    
<form method="POST">
    <input type="text" name="query" placeholder="Ej: set:khm" required>
    <button type="submit">Exportar CSV</button>
</form>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

</body>
</html>
