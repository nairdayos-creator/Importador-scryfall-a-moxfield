<!DOCTYPE html>
<html>
<head>
    <title>Scryfall Exporter</title>
    <style>
        body {
            font-family: Arial;
            max-width: 500px;
            margin: 50px auto;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            background: #4CAF50;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .error {
            color: red;
        }

        .hint {
            color: gray;
            font-size: 12px;
        }
    </style>
</head>

<body>

<h2>Exportador Scryfall → Moxfield</h2>

<p class="hint">
Ejemplo: set:khm o type:dragon
</p>

<!-- FORM PRINCIPAL (CSV) -->
<form method="POST">
    <input type="text" name="query" placeholder="Ej: type:squirrel (game:paper) legal:commander rarity:c prefer:best" required>

    <button type="submit">Exportar CSV</button>
</form>

<!-- FORM SECUNDARIO (TXT) -->
<form method="POST" action="/txt">
    <input type="text" name="query" placeholder="(misma búsqueda que arriba)" required>
    <button type="submit">Exportar TXT (Decklist)</button>
</form>

<!-- ERROR -->
{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

</body>
</html>
